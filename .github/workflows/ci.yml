on:
    push:
        branches:
            - main
            - nightly-testing
    pull_request:
        branches:
            - main
            - nightly-testing
    merge_group:
    release:
        types:
            - published
            - released

name: "Build and check HTML"

permissions:
    contents: read

jobs:
    build:
        name: Build site and generate HTML
        runs-on: nscloud-ubuntu-22.04-amd64-8x16
        env:
            VALE_VERSION: "3.21.0"
            VALE_SHA256: "96997d19a4ca6981673b0d4c5ca7f3ede4a9f97964a96edc29fba9e28a328336"

        steps:
            - name: Display usage limits
              run: |
                  ulimit -a

            - name: Install elan
              run: |
                  set -o pipefail
                  curl -sSfL https://github.com/leanprover/elan/releases/download/v4.4.0/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
                  ./elan-init -y --default-toolchain none
                  echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

            - uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false

            # The toolchain download, the cache restoration, and the Python
            # and Node setup run at the same time.
            - name: Lean Version
              id: lean-version
              background: true
              run: |
                  lean --version

            - name: Cache .lake
              id: restore-cache
              background: true
              uses: actions/cache/restore@v6.1.0
              with:
                  path: |
                      .lake/packages
                      .lake/build/bin
                      .lake/build/ir
                      .lake/build/lib
                  key:
                      ${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{
                      hashFiles('lake-manifest.json') }}-${{ hashFiles('lakefile.lean') }}-${{
                      github.sha }}
                  restore-keys: |
                      ${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ hashFiles('lakefile.lean') }}-${{ github.sha }}
                      ${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ hashFiles('lakefile.lean') }}
                      ${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-
                      ${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-

            - name: Set up Python
              id: setup-python
              background: true
              uses: actions/setup-python@v7.1.0
              with:
                  python-version: "3.10"

            - name: Set up Node
              id: setup-node
              background: true
              uses: actions/setup-node@v7.1.0
              with:
                  node-version: "lts/*"
                  cache: npm

            - name: Wait for setup
              wait: [lean-version, restore-cache, setup-python, setup-node]

            # The cache holds the Vale binary and the virtual environment
            # that the HTML preprocessor runs in.
            - name: Cache prose linter
              uses: actions/cache@v6.1.0
              with:
                  path: ${{ runner.temp }}/vale
                  key:
                      vale-${{ runner.os }}-${{ env.VALE_VERSION }}-py${{
                      steps.setup-python.outputs.python-version }}-${{
                      hashFiles('.vale/scripts/requirements.txt') }}

            # The tool installations run in the background during the build.
            - name: Install LinkChecker
              id: install-linkchecker
              background: true
              run: |
                  python -m pip install --upgrade pip
                  pip install linkchecker

            - name: Install prose linter
              id: install-vale
              background: true
              run: |
                  set -euo pipefail
                  if [ -x "$RUNNER_TEMP/vale/vale" ] && [ -x "$RUNNER_TEMP/vale/venv/bin/python" ]; then
                      echo "Using the cached prose linter"
                      exit 0
                  fi
                  tarball="vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
                  curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
                      -o "$RUNNER_TEMP/$tarball" \
                      "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/$tarball"
                  echo "$VALE_SHA256  $RUNNER_TEMP/$tarball" | sha256sum --check
                  mkdir -p "$RUNNER_TEMP/vale"
                  tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/vale" vale
                  python -m venv "$RUNNER_TEMP/vale/venv"
                  "$RUNNER_TEMP/vale/venv/bin/pip" install -r .vale/scripts/requirements.txt

            - name: Install TypeScript
              id: install-npm
              background: true
              run: npm ci

            - name: Build
              run: |
                  lake --no-ansi build 2>&1 | tee build.log
            - name: Generate build time summary
              if: always() # Run even if build fails
              run: |
                  # Create build times summary
                  {
                      echo "## Build Times Summary"
                      echo ""
                      echo "Sorted by build time (longest first):"
                      echo ""
                      echo "| Component | Time |"
                      echo "|-----------|------|"
                  } >> "$GITHUB_STEP_SUMMARY"

                  # Parse build output, convert times to seconds for sorting, then sort
                  if [ -f build.log ]; then
                  # Create temporary Python script
                  cat > parse_times.py << 'EOF'
                  import sys
                  import re

                  def time_to_seconds(time_str):
                      if 'ms' in time_str:
                          return float(time_str.replace('ms', '')) / 1000
                      elif 's' in time_str:
                          return float(time_str.replace('s', ''))
                      return 0

                  lines = []
                  for line in sys.stdin:
                      time_str, component = line.strip().split('|', 1)
                      seconds = time_to_seconds(time_str)
                      lines.append((seconds, time_str, component.strip()))

                  lines.sort(reverse=True)

                  for _, time_str, component in lines:
                      print(f'| {component} | {time_str} |')
                  EOF

                    grep "[✔⚠].*Built.*(" build.log | \
                    sed -E 's/.*Built ([^(]+) \(([^)]+)\).*/\2|\1/' | \
                    python3 parse_times.py >> "$GITHUB_STEP_SUMMARY"

                    rm parse_times.py
                  else
                    echo "No build log found" >> "$GITHUB_STEP_SUMMARY"
                  fi

            - name: Save cache for .lake
              id: save-cache
              background: true
              uses: actions/cache/save@v6.1.0
              with:
                  path: |
                      .lake/packages
                      .lake/build/bin
                      .lake/build/ir
                      .lake/build/lib
                  key:
                      ${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{
                      hashFiles('lake-manifest.json') }}-${{ hashFiles('lakefile.lean') }}-${{
                      github.sha }}

            - name: Generate HTML (non-release)
              if: github.event_name != 'release'
              run: |
                  ./generate-html.sh --mode preview

            - name: Generate HTML (release)
              if: github.event_name == 'release'
              run: |
                  # Extract version from release tag (remove 'v' prefix)
                  VERSION=${GITHUB_REF#refs/tags/v}
                  ./generate-html.sh --mode production --version "$VERSION"

            - name: Wait for tool installations
              wait: [install-linkchecker, install-vale, install-npm]

            # The checks run in the background. The final step of the job
            # waits for them and fails if any of them failed.
            - name: Check Manual Examples are Isolated
              id: check-examples
              background: true
              run: |
                  scripts/check-examples-isolated.sh

            - name: Verify tutorial project zip files build
              id: check-zips
              background: true
              if: github.event_name != 'release'
              run: |
                  # On Linux, some nightly toolchains currently report a version string that
                  # the zips turn into a toolchain name that elan rejects, so build the
                  # projects with this repository's toolchain instead. Releases and release
                  # candidates are unaffected and build with the toolchain from the zip.
                  # See https://github.com/leanprover/lean4/issues/14702
                  if grep -q nightly lean-toolchain; then
                      scripts/check-tutorial-zips.sh "$(cat lean-toolchain)"
                  else
                      scripts/check-tutorial-zips.sh
                  fi

            - name: Run LinkChecker (local links only)
              id: check-links
              background: true
              if: github.event_name == 'push' || github.event_name == 'pull_request'
              run: |
                  linkchecker --config=.linkchecker/linkcheckerrc './_out/html-multi/'

            # The HTML needs preprocessing to work well with Vale. The
            # preprocessed copy is written outside of _out, which keeps it
            # out of the HTML artifact.
            - name: Prose linter
              id: prose-lint
              background: true
              run: |
                  set -o pipefail
                  "$RUNNER_TEMP/vale/venv/bin/python" .vale/scripts/rewrite_html.py \
                      _out/html-multi "$RUNNER_TEMP/html-vale"
                  "$RUNNER_TEMP/vale/vale" --output JSON "$RUNNER_TEMP/html-vale/" \
                      | python .vale/scripts/report.py

            - name: Type check the search bar code
              id: type-check-js
              background: true
              run: |
                  cd _out/html-multi/-verso-search
                  npx tsc --noEmit -p jsconfig.json

            - name: Generate proofreading HTML
              if: github.event_name == 'pull_request'
              run: |
                  ./generate-html.sh --mode preview --draft --output _out/draft-site

            # Drop deploy/netlify-headers as _headers at each possible Netlify
            # publish-dir root so hashed search-index buckets can be cached
            # immutably. See deploy/netlify-headers for the rules.
            - name: Install Netlify cache headers
              run: |
                  for dir in _out/site _out/site/reference _out/html-multi _out/draft-site _out/draft/html-multi; do
                      if [ -d "$dir" ]; then
                          cp deploy/netlify-headers "$dir/_headers"
                      fi
                  done

            - name: Save generated HTML to artifact storage
              uses: actions/upload-artifact@v7.0.2
              with:
                  name: "html"
                  path: "_out/"
                  retention-days: 5
                  overwrite: true

            - name: Report word count
              run: |
                  echo "Word Counts"
                  echo "-----------"
                  cat words.txt

            - name: Save word count
              run: |
                  {
                      echo "# Word Counts"
                      echo ""
                      echo "\`\`\`"
                      cat words.txt
                      echo "\`\`\`"
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Wait for checks
              wait-all:

    deploy:
        name: Deploy release
        runs-on: ubuntu-latest
        needs: [build]
        if: github.event_name == 'release'
        # The Netlify step records a GitHub deployment and a commit status.
        permissions:
            contents: read
            deployments: write
            statuses: write
        outputs:
            ref-url: ${{ steps.deploy-release.outputs.deploy-url }}
        steps:
            - name: Get generated HTML from artifact storage
              uses: actions/download-artifact@v8.0.2
              with:
                  name: "html"
                  path: "_out/"

            # deploy-alias computes a URL component for the PR preview. This
            # is so we can have a stable name to use for feedback on draft
            # material.
            - id: deploy-alias
              uses: actions/github-script@v9.0.0
              name: Compute Alias
              with:
                  script: |
                      if (process.env.PR) {
                          return `pr-${process.env.PR}`
                      } else {
                          return 'deploy-preview-main';
                      }
              env:
                  PR: ${{ github.event.number }}

              # deploy-info computes metadata that's shown in the Netlify interface
              # about the deployment (for non-PR deploys)
            - id: deploy-info
              name: Compute Deployment Metadata
              if: github.event_name != 'pull_request'
              run: |
                  set -e
                  echo "message=$(git log -1 --pretty=format:"%s")" >> "$GITHUB_OUTPUT"

            # When a release is created in GH, push to the main site without proofreading info
            # This is lean-reference-manual.netlify.app
            - name: Deploy releases when tags are pushed
              id: deploy-release
              uses: nwtgck/actions-netlify@v4.0.0
              if: github.event_name == 'release'
              with:
                  publish-dir: _out/site/reference
                  production-branch: main
                  production-deploy: true
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  deploy-message: |
                      Release from tag ${{ github.ref }}
                  enable-commit-comment: false
                  enable-pull-request-comment: false
                  fails-without-credentials: true
              env:
                  NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
                  NETLIFY_SITE_ID: "447031bf-9a96-4cee-831b-1f73599a7cb2"

    preview:
        name: Deploy preview
        runs-on: ubuntu-latest
        needs: [build]
        if: github.event_name == 'push' && github.ref_name == 'nightly-testing'
        # The Netlify step records a GitHub deployment and a commit status.
        permissions:
            contents: read
            deployments: write
            statuses: write
        steps:
            - name: Get generated HTML from artifact storage
              uses: actions/download-artifact@v8.0.2
              with:
                  name: "html"
                  path: "_out/"

            - name: Deploy current draft
              id: deploy-draft
              uses: nwtgck/actions-netlify@v4.0.0
              with:
                  publish-dir: _out/html-multi
                  production-branch: main
                  production-deploy: true
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  deploy-message: |
                      ${{ format('preview of {0}', github.ref) }}
                  enable-commit-comment: false
                  enable-pull-request-comment: false
                  github-deployment-description: |
                      Latest draft (without proofreading info)
                  fails-without-credentials: true
              env:
                  NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
                  NETLIFY_SITE_ID: "32e0f63e-7a18-4bf9-87f4-713650c7db70"

    check-links:
        name: Check links
        runs-on: ubuntu-latest
        needs: [deploy]
        if: github.event_name == 'release'
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false
                  sparse-checkout: |
                      .skip-link-check

            - name: Online link checker
              uses: filiph/linkcheck@2.0.23
              continue-on-error: true
              with:
                  arguments: --skip-file .skip-link-check -e ${{ needs.deploy.outputs.ref-url }}
