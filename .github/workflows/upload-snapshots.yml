name: "Deploy the 'postdeploy' branch"
on:
    workflow_run:
        workflows: ["Apply Overlays"]
        types:
            - completed

    push:
        branches:
            - "postdeploy"

    workflow_dispatch:

permissions:
    contents: read

jobs:
    # Both jobs act on a run of "Apply Overlays" only when it succeeded and was started in this
    # repository by a push, by another workflow, or by hand.
    deploy:
        name: Deploy release branch to hosting
        runs-on: ubuntu-latest
        if: >
            github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion ==
            'success' && contains(fromJSON('["push", "workflow_run", "workflow_dispatch"]'),
            github.event.workflow_run.event) && github.event.workflow_run.head_repository.full_name
            == github.repository)
        # The Netlify step records a GitHub deployment and a commit status.
        permissions:
            contents: read
            deployments: write
            statuses: write
        steps:
            - name: Checkout postdeploy branch
              uses: actions/checkout@v7.0.1
              with:
                  ref: "postdeploy"
                  persist-credentials: false

            - name: Upload the current state of the postdeploy branch
              id: deploy-release
              uses: nwtgck/actions-netlify@v4.0.0
              with:
                  publish-dir: "."
                  production-branch: postdeploy
                  production-deploy: true
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  deploy-message: |
                      Deploy from ${{ github.ref }}
                  enable-commit-comment: false
                  enable-pull-request-comment: false
                  fails-without-credentials: true
              env:
                  NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
                  # This is the site called 'lean-reference-manual-versions'
                  NETLIFY_SITE_ID: "91dc33ef-6016-4ac7-bac1-d574e2254405"

    deploy-tutorials:
        name: Deploy tutorials release branch to hosting
        runs-on: ubuntu-latest
        if: >
            github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion ==
            'success' && contains(fromJSON('["push", "workflow_run", "workflow_dispatch"]'),
            github.event.workflow_run.event) && github.event.workflow_run.head_repository.full_name
            == github.repository)
        # The Netlify step records a GitHub deployment and a commit status.
        permissions:
            contents: read
            deployments: write
            statuses: write
        steps:
            - name: Checkout postdeploy-tutorials branch
              uses: actions/checkout@v7.0.1
              with:
                  ref: "postdeploy-tutorials"
                  persist-credentials: false

            - name: Upload the current state of the postdeploy-tutorials branch
              uses: nwtgck/actions-netlify@v4.0.0
              with:
                  publish-dir: "."
                  production-branch: postdeploy-tutorials
                  production-deploy: true
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  deploy-message: |
                      Deploy tutorials from ${{ github.ref }}
                  enable-commit-comment: false
                  enable-pull-request-comment: false
                  fails-without-credentials: true
              env:
                  NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
                  NETLIFY_SITE_ID: "e76b4246-fee7-491e-91ef-a87fffff6ce1"
