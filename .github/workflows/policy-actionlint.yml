name: Lint GitHub Actions workflows

on:
    pull_request:
    merge_group:

permissions:
    contents: read

jobs:
    actionlint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false

            - name: Run actionlint
              uses: reviewdog/action-actionlint@v1.84.1
              with:
                  fail_level: any
